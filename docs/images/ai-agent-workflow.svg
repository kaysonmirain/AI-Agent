<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-label="AI Agent workflow diagram">
  <rect width="1100" height="330" rx="26" fill="#0f172a"/>

  <text x="70" y="74" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">
    AI Agent
  </text>
  <text x="70" y="112" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">
    Local Ollama assistant with guarded workspace tools
  </text>

  <rect x="70" y="175" width="180" height="86" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="325" y="175" width="180" height="86" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="580" y="175" width="180" height="86" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="835" y="175" width="195" height="86" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="160" y="211" fill="#e0f2fe" font-size="19" font-weight="800">User Task</text>
    <text x="160" y="235" fill="#93c5fd" font-size="13">request or file change</text>

    <text x="415" y="211" fill="#ede9fe" font-size="19" font-weight="800">Local Model</text>
    <text x="415" y="235" fill="#c4b5fd" font-size="13">Ollama response</text>

    <text x="670" y="211" fill="#dcfce7" font-size="19" font-weight="800">Tool Plan</text>
    <text x="670" y="235" fill="#86efac" font-size="13">preview diff first</text>

    <text x="932.5" y="211" fill="#fef3c7" font-size="19" font-weight="800">Workspace</text>
    <text x="932.5" y="235" fill="#fcd34d" font-size="13">safe edits + audit log</text>
  </g>

  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M265 218H310"/>
    <path d="M520 218H565"/>
    <path d="M775 218H820"/>
  </g>

  <g fill="#64748b">
    <path d="M310 218l-13-8v16z"/>
    <path d="M565 218l-13-8v16z"/>
    <path d="M820 218l-13-8v16z"/>
  </g>
</svg>
